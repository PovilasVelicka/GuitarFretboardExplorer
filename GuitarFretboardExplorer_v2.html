<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Guitar Fretboard Explorer 2.0</title>
    <style>
        body {
            font-family: Segoe UI;
            margin: 15px;
            background: #f3f3f3
        }

        h2 {
            margin: 0 0 10px
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px
        }

        select {
            padding: 6px
        }

        select:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #f0f0f0;
        }

        #wrap {
            display: flex;
            gap: 20px
        }

        .board {
            background: #d7ab73;
            padding: 12px;
            border-radius: 10px;
            overflow: auto
        }

        table {
            border-collapse: collapse
        }

        th,
        td {
            width: 42px;
            height: 38px;
            text-align: center
        }

        .lbl {
            font-weight: bold
        }

        .light {
            background: #d7ab73
        }

        .dark {
            background: #c59659
        }

        .fret {
            border-right: 3px solid silver;
            position: relative
        }

        .s1 {
            border-bottom: 1px solid #555
        }

        .s2 {
            border-bottom: 2px solid #555
        }

        .s3 {
            border-bottom: 3px solid #555
        }

        .s4 {
            border-bottom: 4px solid #555
        }

        .s5 {
            border-bottom: 5px solid #555
        }

        .s6 {
            border-bottom: 6px solid #555
        }

        .note {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            color: #fff;
            font-size: 10px;
            font-weight: bold
        }

        .panel {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            min-width: 220px
        }



        .root {

            background: gold !important;
            color: black !important;

            border: 2px solid #444;

            box-shadow:
                0 0 8px gold,
                0 0 15px gold;

        }

        .third {
            background: #28a745 !important
        }

        .fifth {
            background: #007bff !important
        }

        .marker {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%)
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }

        .ctrl {
            display: flex;
            flex-direction: column;
        }

        .ctrl label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }

        .ctrl select {
            min-width: 130px;
            padding: 6px;
        }
    </style>
</head>

<body>
    <div class="controls">

        <div class="ctrl">
            <label for="mode">Режим</label>
            <select id="mode">
                <option value="all">Все ноты</option>
                <option value="note">Нота</option>
                <option value="scale">Гамма</option>
                <option value="chord">Аккорд</option>
            </select>
        </div>

        <div class="ctrl">
            <label for="note">Нота</label>
            <select id="note"></select>
        </div>

        <div class="ctrl">
            <label for="root">Тоника</label>
            <select id="root"></select>
        </div>

        <div class="ctrl">
            <label for="scale">Гамма</label>
            <select id="scale">
                <option>Major</option>
                <option>Minor</option>
                <option>Pentatonic Major</option>
                <option>Pentatonic Minor</option>
            </select>
        </div>

        <div class="ctrl">
            <label for="lang">Язык</label>
            <select id="lang">
                <option value="en">EN</option>
                <option value="ru">RU</option>
            </select>
        </div>

        <div class="ctrl">
            <label for="chord">Аккорд</label>
            <select id="chord"></select>
        </div>

        <div class="ctrl">
            <label for="pos">Позиция</label>
            <select id="pos"></select>
        </div>

    </div>

    <div id="wrap">
        <div id="board" class="board"></div>

        <div class="panel">

            <div id="chordPanel">
                <h3>Аккорд</h3>
                <div id="diag"></div>
            </div>

            <div id="intervalPanel">
                <h3>Информация</h3>
                <div id="info">
                    Наведи мышь на ноту
                </div>
            </div>

        </div>
    </div>
    <script>
        const N = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const RU = {C: 'До', 'C#': 'До#', D: 'Ре', 'D#': 'Ре#', E: 'Ми', F: 'Фа', 'F#': 'Фа#', G: 'Соль', 'G#': 'Соль#', A: 'Ля', 'A#': 'Ля#', B: 'Си'};
        const C = {C: '#e53935', 'C#': '#fb8c00', D: '#fdd835', 'D#': '#9ccc65', E: '#43a047', F: '#00897b', 'F#': '#00acc1', G: '#1e88e5', 'G#': '#3949ab', A: '#8e24aa', 'A#': '#d81b60', B: '#6d4c41'};
        const T = ['E', 'B', 'G', 'D', 'A', 'E'];
        const SCALES = {
            Major: [0, 2, 4, 5, 7, 9, 11],
            Minor: [0, 2, 3, 5, 7, 8, 10],
            'Pentatonic Major': [0, 2, 4, 7, 9],
            'Pentatonic Minor': [0, 3, 5, 7, 10]
        };
        const OPEN_STRINGS = [
            {note: "E", octave: 4}, // 1 струна
            {note: "B", octave: 3}, // 2
            {note: "G", octave: 3}, // 3
            {note: "D", octave: 3}, // 4
            {note: "A", octave: 2}, // 5
            {note: "E", octave: 2}  // 6
        ];
        const CH = {

            C: [
                {n: 'Open', f: ['X', 3, 2, 0, 1, 0]},
                {n: 'Barre 8', f: [8, 10, 10, 9, 8, 8]}
            ],

            Cm: [
                {n: 'Barre 3', f: ['X', 3, 5, 5, 4, 3]},
                {n: 'Barre 8', f: [8, 10, 10, 8, 8, 8]}
            ],

            C7: [
                {n: 'Open', f: ['X', 3, 2, 3, 1, 0]}
            ],

            Cmaj7: [
                {n: 'Open', f: ['X', 3, 2, 0, 0, 0]}
            ],

            D: [
                {n: 'Open', f: ['X', 'X', 0, 2, 3, 2]},
                {n: 'Barre 5', f: [5, 5, 7, 7, 7, 5]}
            ],

            Dm: [
                {n: 'Open', f: ['X', 'X', 0, 2, 3, 1]},
                {n: 'Barre 5', f: [5, 5, 7, 7, 6, 5]}
            ],

            D7: [
                {n: 'Open', f: ['X', 'X', 0, 2, 1, 2]}
            ],

            E: [
                {n: 'Open', f: [0, 2, 2, 1, 0, 0]},
                {n: 'Barre 12', f: [12, 14, 14, 13, 12, 12]}
            ],

            Em: [
                {n: 'Open', f: [0, 2, 2, 0, 0, 0]},
                {n: 'Barre 12', f: [12, 14, 14, 12, 12, 12]}
            ],

            E7: [
                {n: 'Open', f: [0, 2, 0, 1, 0, 0]}
            ],

            Em7: [
                {n: 'Open', f: [0, 2, 2, 0, 3, 0]}
            ],

            F: [
                {n: 'Barre 1', f: [1, 3, 3, 2, 1, 1]},
                {n: 'Mini', f: ['X', 'X', 3, 2, 1, 1]}
            ],

            Fm: [
                {n: 'Barre 1', f: [1, 3, 3, 1, 1, 1]}
            ],

            F7: [
                {n: 'Barre 1', f: [1, 3, 1, 2, 1, 1]}
            ],

            G: [
                {n: 'Open', f: [3, 2, 0, 0, 0, 3]},
                {n: 'Barre 3', f: [3, 5, 5, 4, 3, 3]},
                {n: 'Barre 10', f: [10, 10, 12, 12, 12, 10]}
            ],

            Gm: [
                {n: 'Barre 3', f: [3, 5, 5, 3, 3, 3]},
                {n: 'Barre 10', f: [10, 12, 12, 10, 10, 10]}
            ],

            G7: [
                {n: 'Open', f: [3, 2, 0, 0, 0, 1]}
            ],

            A: [
                {n: 'Open', f: ['X', 0, 2, 2, 2, 0]},
                {n: 'Barre 5', f: [5, 7, 7, 6, 5, 5]}
            ],

            Am: [
                {n: 'Open', f: ['X', 0, 2, 2, 1, 0]},
                {n: 'Barre 5', f: [5, 7, 7, 5, 5, 5]},
                {n: 'Barre 12', f: [12, 14, 14, 12, 13, 12]}
            ],

            A7: [
                {n: 'Open', f: ['X', 0, 2, 0, 2, 0]}
            ],

            Am7: [
                {n: 'Open', f: ['X', 0, 2, 0, 1, 0]}
            ],

            B: [
                {n: 'Barre 2', f: ['X', 2, 4, 4, 4, 2]},
                {n: 'Barre 7', f: [7, 9, 9, 8, 7, 7]}
            ],

            Bm: [
                {n: 'Barre 2', f: ['X', 2, 4, 4, 3, 2]},
                {n: 'Barre 7', f: [7, 9, 9, 7, 7, 7]}
            ],

            B7: [
                {n: 'Open', f: ['X', 2, 1, 2, 0, 2]}
            ],

            Dsus2: [
                {n: 'Open', f: ['X', 'X', 0, 2, 3, 0]}
            ],

            Dsus4: [
                {n: 'Open', f: ['X', 'X', 0, 2, 3, 3]}
            ],

            Asus2: [
                {n: 'Open', f: ['X', 0, 2, 2, 0, 0]}
            ],

            Asus4: [
                {n: 'Open', f: ['X', 0, 2, 2, 3, 0]}
            ],

            Gsus4: [
                {n: 'Open', f: [3, 3, 0, 0, 1, 3]}
            ],

            Eadd9: [
                {n: 'Open', f: [0, 2, 4, 1, 0, 0]}
            ],

            Cadd9: [
                {n: 'Open', f: ['X', 3, 2, 0, 3, 3]}
            ]

        };
        function cap(n) {return lang.value === 'ru' ? (RU[n] || n) : n}
        function noteAt(o, f) {return N[(N.indexOf(o) + f) % 12]}
        function fill() {N.forEach(x => {note.innerHTML += `<option>${x}</option>`; root.innerHTML += `<option>${x}</option>`}); Object.keys(CH).forEach(x => chord.innerHTML += `<option>${x}</option>`); fillPos();}
        function fillPos() {pos.innerHTML = ''; CH[chord.value].forEach((p, i) => pos.innerHTML += `<option value=${i}>${p.n}</option>`)}
        function intervalRole(ch, n) {if (!ch) return ''; let notes = []; let pos = CH[ch][0].f; for (let i = 0; i < 6; i++) {if (pos[i] !== 'X') notes.push(noteAt(T[5 - i], pos[i]))} notes = [...new Set(notes)]; if (notes[0] === n) return 'root'; if (notes[1] === n) return 'third'; if (notes[2] === n) return 'fifth'; return ''}
        function draw() {

            let h = "<table>";

            // Заголовок с номерами ладов

            h += "<tr><th></th>";

            for (let fret = 0; fret <= 24; fret++) {
                h += `<th>${fret}</th>`;
            }

            h += "</tr>";

            // Струны

            for (let stringIndex = 0; stringIndex < 6; stringIndex++) {

                h += `<tr><td class="lbl">${T[stringIndex]}</td>`;

                for (let fret = 0; fret <= 24; fret++) {

                    const noteName = noteAt(
                        T[stringIndex],
                        fret
                    );

                    const octave =
                        getOctave(
                            stringIndex,
                            fret
                        );

                    const cls =
                        fret <= 12
                            ? "light"
                            : "dark";

                    let noteHtml = "";

                    // -----------------------
                    // Все ноты
                    // -----------------------

                    if (mode.value === "all") {

                        const octave =
                            getOctave(
                                stringIndex,
                                fret
                            );

                        noteHtml = `
                            <div
                                class="note"
                                title="${noteName}${octave}"
                                style="background:${C[noteName]}"
                                onmouseover="
                                    info.innerHTML=
                                    '<b>Нота:</b> ${cap(noteName)}' +
                                    '<br><b>Международное:</b> ${noteName}' +
                                    '<br><b>Октава:</b> ${octave}' +
                                    '<br><b>Полное обозначение:</b> ${noteName}${octave}' +
                                    '<br><b>Струна:</b> ${stringIndex + 1} (${T[stringIndex]})' +
                                    '<br><b>Лад:</b> ${fret}'
                                ">
                                ${cap(noteName)}
                            </div>`;
                    }

                    // -----------------------
                    // Поиск ноты
                    // -----------------------

                    else if (
                        mode.value === "note" &&
                        noteName === note.value
                    ) {
                        const octave =
                            getOctave(
                                stringIndex,
                                fret
                            );
                        noteHtml = `
                <div
                    class="note"
                    style="background:${C[noteName]}"
                    onmouseover="
                        info.innerHTML=
                                    '<b>Нота:</b> ${cap(noteName)}' +
                                    '<br><b>Международное:</b> ${noteName}' +
                                    '<br><b>Октава:</b> ${octave}' +
                                    '<br><b>Полное обозначение:</b> ${noteName}${octave}' +
                                    '<br><b>Струна:</b> ${stringIndex + 1} (${T[stringIndex]})' +
                                    '<br><b>Лад:</b> ${fret}'
                    ">
                    ${cap(noteName)}
                </div>`;
                    }

                    // -----------------------
                    // Гамма
                    // -----------------------

                    else if (mode.value === "scale") {

                        const rootIndex =
                            N.indexOf(root.value);

                        const interval =
                            (N.indexOf(noteName)
                                - rootIndex + 12) % 12;

                        if (
                            SCALES[scale.value]
                                .includes(interval)
                        ) {

                            const rootClass =

                                noteName === root.value
                                    ? "root"
                                    : "";
                            noteHtml = `
                    <div
                        class="note ${rootClass}"
                        style="background:${C[noteName]}"
                        onmouseover="
                            info.innerHTML=
                            '<b>Тональность:</b> ${root.value}' +
                            '<br><b>Гамма:</b> ${scale.value}' +
                            '<br><b>Нота:</b> ${cap(noteName)}'
                        ">
                        ${cap(noteName)}
                    </div>`;
                        }
                    }

                    // -----------------------
                    // Аккорд
                    // -----------------------

                    else if (mode.value === "chord") {

                        const position =
                            CH[chord.value]
                            [Number(pos.value || 0)];

                        if (position) {

                            const playFret =
                                position.f[5 - stringIndex];

                            if (
                                playFret === "X" &&
                                fret === 0
                            ) {

                                noteHtml =
                                    `<div class="note"
                            style="background:#999">
                            X
                        </div>`;
                            }

                            else if (
                                playFret === fret
                            ) {

                                const role =
                                    intervalRole(
                                        chord.value,
                                        noteName
                                    );

                                noteHtml = `
                        <div
                            class="note ${role}"
                            onmouseover="
                                info.innerHTML=
                                '<b>Аккорд:</b> ${chord.value}' +
                                '<br><b>Нота:</b> ${cap(noteName)}' +
                                '<br><b>Роль:</b> ${role || "Другая"}' +
                                '<br><b>Струна:</b> ${stringIndex + 1}' +
                                '<br><b>Лад:</b> ${fret}'
                            ">
                            ${cap(noteName)}
                        </div>`;
                            }
                        }
                    }

                    // Метки ладов

                    let marker = "";

                    if (
                        [3, 5, 7, 9, 12, 15, 17, 19, 21, 24]
                            .includes(fret)
                    ) {
                        marker =
                            '<div class="marker"></div>';
                    }

                    h += `
            <td class="fret s${stringIndex + 1} ${cls}">
                ${noteHtml}
                ${marker}
            </td>`;
                }

                h += "</tr>";
            }

            h += "</table>";

            board.innerHTML = h;

            // -----------------------
            // Правая панель
            // -----------------------

            if (mode.value === "chord") {

                const position =
                    CH[chord.value]
                    [Number(pos.value || 0)];

                if (position) {

                    diag.innerHTML =

                        `<b>Аккорд:</b> ${chord.value}<br>
                 <b>Позиция:</b> ${position.n}<br><br>

                 <b>Аппликатура</b><br>

                 6 струна: ${position.f[0]}<br>
                 5 струна: ${position.f[1]}<br>
                 4 струна: ${position.f[2]}<br>
                 3 струна: ${position.f[3]}<br>
                 2 струна: ${position.f[4]}<br>
                 1 струна: ${position.f[5]}`;

                    chordPanel.style.display = "block";
                }

            } else {

                chordPanel.style.display = "none";
            }

        }

        function updateControls() {

            note.disabled = true;
            root.disabled = true;
            scale.disabled = true;
            chord.disabled = true;
            pos.disabled = true;

            switch (mode.value) {

                case "all":
                    break;

                case "note":
                    note.disabled = false;
                    break;

                case "scale":
                    root.disabled = false;
                    scale.disabled = false;
                    break;

                case "chord":
                    chord.disabled = false;
                    pos.disabled = false;
                    break;
            }
        };
        function updatePanels() {

            chordPanel.style.display = "none";
            intervalPanel.style.display = "none";

            switch (mode.value) {

                case "all":
                    intervalPanel.style.display = "block";
                    break;

                case "note":
                    intervalPanel.style.display = "block";
                    break;

                case "scale":
                    intervalPanel.style.display = "block";
                    break;

                case "chord":
                    chordPanel.style.display = "block";
                    intervalPanel.style.display = "block";
                    break;
            }
        };
        function getOctave(stringIndex, fret) {

            const startOctave =
                OPEN_STRINGS[stringIndex].octave;

            const startNote =
                N.indexOf(
                    OPEN_STRINGS[stringIndex].note
                );

            const total =
                startNote + fret;

            return startOctave +
                Math.floor(total / 12);
        };

        fill();
        fillPos();
        updateControls();
        updatePanels();
        draw();
        document.querySelectorAll('select').forEach(
            x => x.onchange = () => {

                if (x.id === 'chord') {
                    fillPos();
                }

                updateControls();
                draw();
                updatePanels();
            }
        );

    </script>
</body>

</html>
